# GitFlic CI/CD Pipeline для CalculatorApp
image: mcr.microsoft.com/dotnet/sdk:6.0

variables:
  PROJECT_NAME: "CalculatorApp"
  BUILD_CONFIGURATION: "Release"
  DOCKER_IMAGE: "calculator-app"
  REGISTRY_URL: "registry.gitflic.ru"

stages:
  - build
  - test
  - analyze
  - package
  - deploy

# Глобальный кеш для NuGet пакетов
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - ~/.nuget/packages/
    - .nuget/packages/

# Глобальные настройки
before_script:
  - dotnet --version
  - dotnet nuget locals all --clear
  - dotnet restore

# ===== СБОРКА =====
build:
  stage: build
  script:
    - dotnet build --configuration $BUILD_CONFIGURATION --no-restore
    - dotnet publish CalculatorApp.Api/CalculatorApp.Api.csproj -c $BUILD_CONFIGURATION -o ./publish
  artifacts:
    paths:
      - ./publish/
      - '**/bin/$BUILD_CONFIGURATION/**'
    expire_in: 1 hour
  tags:
    - docker

# ===== ТЕСТЫ =====
unit-tests:
  stage: test
  script:
    - dotnet test CalculatorApp.Tests/CalculatorApp.Tests.csproj 
      --configuration $BUILD_CONFIGURATION 
      --no-build 
      --filter "FullyQualifiedName~CalculatorTests" 
      --logger "junit;LogFilePath=unit-test-results.xml" 
      --collect:"XPlat Code Coverage"
  artifacts:
    when: always
    reports:
      junit: 
        - '**/unit-test-results.xml'
      coverage:
        - '**/coverage.cobertura.xml'
    paths:
      - '**/TestResults/**'
  coverage: '/Total\|(\d+\.\d+)/'
  tags:
    - docker

integration-tests:
  stage: test
  script:
    - dotnet test CalculatorApp.Tests/CalculatorApp.Tests.csproj 
      --configuration $BUILD_CONFIGURATION 
      --no-build 
      --filter "FullyQualifiedName~IntegrationTests" 
      --logger "junit;LogFilePath=integration-test-results.xml"
  artifacts:
    when: always
    reports:
      junit: 
        - '**/integration-test-results.xml'
  tags:
    - docker

# ===== АНАЛИЗ КОДА =====
code-analysis:
  stage: analyze
  script:
    - dotnet format --verify-no-changes --verbosity detailed
    - dotnet build --configuration $BUILD_CONFIGURATION /warnaserror
  allow_failure: true
  tags:
    - docker

security-scan:
  stage: analyze
  image: owasp/dependency-check:latest
  script:
    - /usr/share/dependency-check/bin/dependency-check.sh 
      --scan . 
      --format HTML 
      --out ./security-report.html
    - /usr/share/dependency-check/bin/dependency-check.sh 
      --scan . 
      --format JSON 
      --out ./security-report.json
  artifacts:
    paths:
      - security-report.html
      - security-report.json
    expire_in: 7 days
  allow_failure: true
  when: manual
  tags:
    - docker

# ===== УПАКОВКА =====
docker-build:
  stage: package
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $REGISTRY_URL
  script:
    - |
      docker build \
        --build-arg BUILD_CONFIGURATION=$BUILD_CONFIGURATION \
        -t $REGISTRY_URL/$CI_PROJECT_NAMESPACE/$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA \
        -t $REGISTRY_URL/$CI_PROJECT_NAMESPACE/$DOCKER_IMAGE:latest \
        -t $REGISTRY_URL/$CI_PROJECT_NAMESPACE/$DOCKER_IMAGE:$CI_COMMIT_REF_SLUG \
        .
    - docker push $REGISTRY_URL/$CI_PROJECT_NAMESPACE/$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/$CI_PROJECT_NAMESPACE/$DOCKER_IMAGE:latest
    - docker push $REGISTRY_URL/$CI_PROJECT_NAMESPACE/$DOCKER_IMAGE:$CI_COMMIT_REF_SLUG
  only:
    - main
    - develop
  tags:
    - docker

create-release:
  stage: package
  image: alpine:latest
  before_script:
    - apk add --no-cache zip curl
  script:
    - cd ./publish
    - zip -r ../$PROJECT_NAME-$CI_COMMIT_TAG.zip .
    - cd ..
    - |
      curl --header "PRIVATE-TOKEN: $GITFLIC_API_TOKEN" \
           --upload-file ./$PROJECT_NAME-$CI_COMMIT_TAG.zip \
           "https://gitflic.ru/api/v4/projects/$CI_PROJECT_ID/packages/generic/$PROJECT_NAME/$CI_COMMIT_TAG/$PROJECT_NAME-$CI_COMMIT_TAG.zip"
  only:
    - tags
  tags:
    - docker

# ===== ДЕПЛОЙ =====
deploy-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$STAGING_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_HOST "bash -s" << 'EOF'
        set -e
        cd /opt/calculator-app
        
        echo "Logging into GitFlic Registry..."
        echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin registry.gitflic.ru
        
        echo "Pulling new image..."
        docker pull registry.gitflic.ru/${CI_PROJECT_NAMESPACE}/calculator-app:develop
        
        echo "Restarting service..."
        docker-compose down
        docker-compose up -d
        
        echo "Waiting for healthcheck..."
        sleep 10
        curl -f http://localhost:5000/health || exit 1
        
        echo "Cleaning up old images..."
        docker image prune -f
        
        echo "Deploy successful!"
      EOF
  environment:
    name: staging
    url: https://staging-calculator.example.com
  only:
    - develop
  when: on_success
  tags:
    - docker

deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$PRODUCTION_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $PRODUCTION_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_HOST "bash -s" << 'EOF'
        set -e
        cd /opt/calculator-app
        
        echo "Creating backup..."
        docker tag calculator-app:current calculator-app:backup-$(date +%Y%m%d_%H%M%S) || true
        
        echo "Logging into GitFlic Registry..."
        echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin registry.gitflic.ru
        
        echo "Pulling new image..."
        docker pull registry.gitflic.ru/${CI_PROJECT_NAMESPACE}/calculator-app:main
        
        echo "Tagging as current..."
        docker tag registry.gitflic.ru/${CI_PROJECT_NAMESPACE}/calculator-app:main calculator-app:current
        
        echo "Restarting service..."
        docker-compose down
        docker-compose up -d
        
        echo "Running healthcheck..."
        sleep 15
        if curl -f http://localhost:5000/health; then
          echo "✅ Deploy successful!"
          docker image prune -f
        else
          echo "❌ Healthcheck failed! Rolling back..."
          docker-compose down
          docker tag calculator-app:backup-* calculator-app:current || true
          docker-compose up -d
          exit 1
        fi
      EOF
  environment:
    name: production
    url: https://calculator.example.com
  only:
    - main
  when: manual
  tags:
    - docker

# ===== УВЕДОМЛЕНИЯ =====
notify-telegram-success:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
        -d "chat_id=$TELEGRAM_CHAT_ID" \
        -d "parse_mode=HTML" \
        -d "text=<b>✅ Успешный деплой $PROJECT_NAME</b>%0A
        <b>Среда:</b> $CI_ENVIRONMENT_NAME%0A
        <b>Ветка:</b> $CI_COMMIT_REF_NAME%0A
        <b>Коммит:</b> $CI_COMMIT_SHORT_SHA%0A
        <b>Автор:</b> $GITLAB_USER_NAME%0A
        <b>Время:</b> $(date '+%Y-%m-%d %H:%M:%S')%0A
        <a href='$CI_JOB_URL'>Посмотреть в GitFlic</a>"
  only:
    - main
    - develop
  when: on_success
  tags:
    - docker

notify-telegram-failure:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
        -d "chat_id=$TELEGRAM_CHAT_ID" \
        -d "parse_mode=HTML" \
        -d "text=<b>❌ Ошибка в пайплайне $PROJECT_NAME</b>%0A
        <b>Ветка:</b> $CI_COMMIT_REF_NAME%0A
        <b>Стадия:</b> $CI_JOB_STAGE%0A
        <b>Коммит:</b> $CI_COMMIT_SHORT_SHA%0A
        <b>Автор:</b> $GITLAB_USER_NAME%0A
        <a href='$CI_JOB_URL'>Посмотреть лог ошибки</a>"
  when: on_failure
  tags:
    - docker